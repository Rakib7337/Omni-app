<!doctype html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniDownloader — বিজ্ঞাপন-মুক্ত অ্যান্ড্রয়েড ভিডিও ডাউনলোডার, ফিড ও মিডিয়া অ্যাপ</title>
    <meta
      name="description"
      content="১,০০০+ সাইট থেকে 4K ভিডিও, MP3 মিউজিক ও প্লেলিস্ট সেভ করুন, বিজ্ঞাপন ছাড়া ভিডিও দেখুন, পপ-আপ ছাড়াই ব্রাউজ করুন এবং ফোনেই ক্লিপ ট্রিম বা কনভার্ট করুন।"
    />
    <meta property="og:title" content="OmniDownloader — Ad-Free Android Video Downloader, Feeds & Media App" />
    <meta
      property="og:description"
      content="All-in-one Android app for saving 4K videos and MP3s, watching ad-free feeds, clean mobile browsing, and quick audio or video editing."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('omni-theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('omni-lang');
          document.documentElement.lang = savedLang === 'en' ? 'en' : 'bn';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-[#0F172A] dark:text-[#F8FAFC] antialiased selection:bg-[#0288D1]/20 selection:text-[#0288D1]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
